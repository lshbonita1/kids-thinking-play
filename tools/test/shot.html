<!doctype html><meta charset="utf-8"><style>body{margin:0}</style>
<iframe id="f" src="../../index.html" style="width:390px;height:844px;border:0"></iframe>
<script>
const q = new URLSearchParams(location.search);
const f = document.getElementById('f');
f.onload = () => setTimeout(() => {
  const w = f.contentWindow;
  w.localStorage.clear();
  w.eval(`settings.sound=false; settings.tips=false; settings.level=${q.get('lv')}; playGame(GAMES.find(g => g.id === '${q.get('g')}'))`);
  const after = q.get('do');
  if (after) setTimeout(() => w.eval(after), 1500);
}, 700);
</script>
