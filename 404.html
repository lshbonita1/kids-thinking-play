<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>페이지를 찾을 수 없어요 · 쑥쑥 생각놀이</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #fbf8f2; --line: #ebe4d6; --ink: #4a3f31; --muted: #8a7a62; --green: #3f8a55; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; text-align: center; }
    main { padding: 32px 20px; max-width: 420px; }
    svg { width: 140px; height: 140px; }
    h1 { margin: 16px 0 8px; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 28px; }
    p { margin: 0 0 28px; color: var(--muted); line-height: 1.7; word-break: keep-all; }
    .go { display: inline-block; padding: 16px 40px; border-radius: 999px; background: #ffd76e; box-shadow: 0 6px 0 #e9b44c; color: #5b4320; font-family: 'Jua', sans-serif; font-size: 22px; text-decoration: none; }
    .go:active { transform: translateY(3px); box-shadow: 0 3px 0 #e9b44c; }
    .links { margin-top: 30px; font-size: 15px; }
    .links a { color: var(--green); }
  </style>
</head>
<body>
  <main>
    <!-- 쑥쑥이 (두리번거리는 얼굴) -->
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 36 V22" stroke="#4fa86f" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="37" cy="20" rx="14" ry="7.5" fill="#6cc08a" transform="rotate(-28 37 20)"/>
      <ellipse cx="63" cy="20" rx="14" ry="7.5" fill="#4fa86f" transform="rotate(28 63 20)"/>
      <circle cx="50" cy="62" r="28" fill="#a9dea1"/>
      <circle cx="44" cy="57" r="4.2" fill="#3b3226"/><circle cx="64" cy="57" r="4.2" fill="#3b3226"/>
      <circle cx="45.4" cy="55.6" r="1.3" fill="#fff"/><circle cx="65.4" cy="55.6" r="1.3" fill="#fff"/>
      <circle cx="32" cy="68" r="4.5" fill="#f4a9a0" opacity=".8"/><circle cx="68" cy="68" r="4.5" fill="#f4a9a0" opacity=".8"/>
      <ellipse cx="54" cy="71" rx="4" ry="3.2" fill="#3b3226"/>
    </svg>
    <h1>앗, 길을 잃었어요</h1>
    <p>찾으시는 페이지가 없어요.<br>주소가 바뀌었거나 잘못 입력되었을 수 있어요.</p>
    <a class="go" href="/">🏠 처음으로</a>
    <div class="links"><a href="/games/">놀이 소개</a> · <a href="/faq.html">자주 묻는 질문</a></div>
  </main>
</body>
</html>
